name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    
jobs:
    verify:
        runs-on: ubuntu-latest
        

        env:
            STRAPI_URL: https://arowa-studio-cms-production.up.railway.app
            NEXT_STRAPI_URL: https://arowa-studio-cms-production.up.railway.app
            NEXT_PUBLIC_SITE_URL: https://www.arowastudio.com
        
        steps:
            - name: Check out the code
              uses: actions/checkout@v4
            
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc -noEmit

            - name: Lint
              run: npm run lint
            
            - name: Build
              run: npm run build